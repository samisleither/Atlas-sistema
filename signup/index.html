<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas - Cadastro</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Atlas</h1>
            <p class="subtitle">Crie sua conta para começar</p>
        </header>

        <main class="main-content">
            <div class="card">
                <h3>Cadastro</h3>
                <form action="../dashboard/index.html" method="POST">
                    <div class="form-group">
                        <label for="name">Nome completo</label>
                        <input type="text" id="name" name="name" required placeholder="Seu nome">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirmar senha</label>
                        <input type="password" id="confirm-password" name="confirm-password" required placeholder="Digite a senha novamente">
                    </div>

                    <button type="submit" class="btn btn-primary">Criar Conta</button>
                </form>

                <p style="margin-top: 20px;">
                    <a href="../login/index.html">Já tem conta? Faça login</a>
                </p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Atlas - Sistema de Organização de Estudos</p>
        </footer>
    </div>
</body>
</html>
