<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas - Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Atlas</h1>
            <p class="subtitle">Faça login para continuar</p>
        </header>

        <main class="main-content">
            <div class="card">
                <h3>Login</h3>
                <form action="../dashboard/index.html" method="POST">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" required placeholder="Digite sua senha">
                    </div>

                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>

                <p style="margin-top: 20px;">
                    <a href="../signup/index.html">Não tem conta? Cadastre-se</a>
                </p>
                <p>
                    <a href="../index.html">Esqueceu a senha?</a>
                </p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Atlas - Sistema de Organização de Estudos</p>
        </footer>
    </div>
</body>
</html>
